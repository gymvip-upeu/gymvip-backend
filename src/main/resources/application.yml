server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

app:
  reminders:
    schedule-enabled: ${REMINDERS_SCHEDULE_ENABLED:false}
  comms:
    url: ${APP_COMMS_URL:${COMMS_SERVICE_URL:http://localhost:8085}}
    token: ${COMMS_SERVICE_TOKEN:${APP_COMMS_TOKEN:}}
  apiperudev:
    base-url: ${APIPERUDEV_BASE_URL:https://api.apiperu.dev}
    token: ${APIPERUDEV_TOKEN:}
    enabled: ${APIPERUDEV_ENABLED:true}
    timeout-ms: ${APIPERUDEV_TIMEOUT_MS:5000}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 27MB
  application:
    name: gymvip-backend
  config:
    import:
      - "optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_JDBC_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 20000
      pool-name: GymVipDevPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_JDBC_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 20000
      pool-name: GymVipProdPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
