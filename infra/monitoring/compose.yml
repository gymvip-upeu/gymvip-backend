services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Configure an approved Prometheus image digest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - /etc/gymvip/metrics/api-token:/run/gymvip/api-token:ro
      - /etc/gymvip/metrics/comms-token:/run/gymvip/comms-token:ro
      - prometheus-data:/prometheus
  grafana:
    image: ${GRAFANA_IMAGE:?Configure an approved Grafana image digest}
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/gymvip/admin-password
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/gymvip.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/gymvip.yml:ro
      - ./dashboard.json:/var/lib/grafana-dashboards/gymvip.json:ro
      - /etc/gymvip/metrics/grafana-password:/run/gymvip/admin-password:ro
      - grafana-data:/var/lib/grafana
volumes:
  prometheus-data:
  grafana-data:
