global:
  scrape_interval: 30s
  scrape_timeout: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: gymvip-api
    scheme: https
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/gymvip/api-token
    static_configs:
      - targets: [api.internal.example]
  - job_name: gymvip-comunicaciones
    scheme: https
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/gymvip/comms-token
    static_configs:
      - targets: [comms.internal.example]
